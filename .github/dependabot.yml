# Dependabot version updates.
# Note: GitHub reads this file from the repository's default branch, which is dev
# (not main), so a change here takes effect as soon as it merges into dev.
# Gradle and Bundler are not configured because this repo has no build.gradle or
# Gemfile yet; add those ecosystems when the files appear.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    # Wait a few days after a release before proposing it, so a compromised
    # or broken release has time to be noticed and yanked.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 (the native compiler) has no JavaScript compiler API yet, which
      # ts-jest, ts-node and typescript-eslint need, and @nestjs/swagger only accepts
      # TypeScript 5 or 6, so `npm ci` fails. Remove this once those support 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # Base images in the Dockerfile and docker-compose.yml are pinned by digest;
  # these keep the digests current.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(ci)"
